<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Continuum modelling for wall-bounded turbulent carrier flows</title>
  <desc id="desc">Four stages connect the microscopic Stokes-drag and hard-particle collision model to an expansion in particle response time, a stochastic closure for unresolved collision history, and a reduced evolution equation for the particle-density field. The current objective is to extend the continuum formulation to wall-bounded turbulent carrier flows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2457a3" stroke-width="2"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#16815b" stroke-width="2"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172130" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="800" y="62" text-anchor="middle" fill="#172130" font-size="46" font-weight="700">Continuum modelling for wall-bounded turbulent carrier flows</text>
    <text x="800" y="103" text-anchor="middle" fill="#50647f" font-size="23">The microscopic dynamics remain deterministic; stochasticity enters only through the reduced description</text>
    <rect x="623" y="116" width="354" height="28" rx="14" fill="#eef3fa" stroke="#c5d2e2"/>
    <text x="800" y="135" text-anchor="middle" fill="#2457a3" font-size="15" font-weight="750" letter-spacing="1">IMPLEMENTED FOR ANALYTICALLY PRESCRIBED CARRIER FLOWS</text>

    <!-- arrows and process labels -->
    <g fill="none" stroke="#2457a3" stroke-width="6" marker-end="url(#arrow)">
      <path d="M357 322H416"/><path d="M732 322H791"/><path d="M1107 322H1166"/>
    </g>
    <!-- stage 1 -->
    <g filter="url(#shadow)"><rect x="42" y="150" width="315" height="350" rx="20" fill="#fff" stroke="#b8c7dc" stroke-width="2"/></g>
    <rect x="42" y="150" width="315" height="60" rx="20" fill="#183f7c"/><rect x="42" y="190" width="315" height="20" fill="#183f7c"/>
    <text x="199" y="190" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">1 · MICROSCOPIC MODEL</text>
    <g transform="translate(78 238)" fill="#2457a3"><circle cx="27" cy="25" r="12"/><circle cx="69" cy="18" r="10"/><circle cx="111" cy="31" r="13"/><circle cx="49" cy="67" r="11"/><circle cx="97" cy="78" r="10"/></g>
    <path d="M220 259C249 235 278 286 312 255M220 289C250 265 279 315 313 284" fill="none" stroke="#7e9fc8" stroke-width="5" stroke-linecap="round"/>
    <text x="72" y="362" fill="#172130" font-size="27" font-weight="700">Deterministic particles</text>
    <text x="72" y="401" fill="#4f5d70" font-size="21">• Stokes relaxation</text>
    <text x="72" y="434" fill="#4f5d70" font-size="21">• hard-particle contacts</text>
    <text x="72" y="467" fill="#4f5d70" font-size="21">• full event history</text>

    <!-- stage 2 -->
    <g filter="url(#shadow)"><rect x="417" y="150" width="315" height="350" rx="20" fill="#fff" stroke="#b8c7dc" stroke-width="2"/></g>
    <rect x="417" y="150" width="315" height="60" rx="20" fill="#2457a3"/><rect x="417" y="190" width="315" height="20" fill="#2457a3"/>
    <text x="574" y="190" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2 · RESPONSE-TIME EXPANSION</text>
    <path d="M460 275H684" fill="none" stroke="#c3d1e4" stroke-width="9" stroke-linecap="round"/>
    <path d="M460 275C515 275 536 235 584 275S648 316 684 275" fill="none" stroke="#2457a3" stroke-width="7" stroke-linecap="round"/>
    <text x="447" y="362" fill="#172130" font-size="27" font-weight="700">Velocity representation</text>
    <text x="447" y="401" fill="#4f5d70" font-size="21">• expansion in particle response time</text>
    <text x="447" y="434" fill="#4f5d70" font-size="21">• higher-order collision terms</text>
    <text x="447" y="467" fill="#4f5d70" font-size="21">• unresolved collisional remainder</text>

    <!-- stage 3 -->
    <g filter="url(#shadow)"><rect x="792" y="150" width="315" height="350" rx="20" fill="#fff" stroke="#acd0c0" stroke-width="2"/></g>
    <rect x="792" y="150" width="315" height="60" rx="20" fill="#16815b"/><rect x="792" y="190" width="315" height="20" fill="#16815b"/>
    <text x="949" y="190" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">3 · CLOSURE</text>
    <path d="M843 279H1058" fill="none" stroke="#c3d8cf" stroke-width="5" stroke-linecap="round"/>
    <g fill="#16815b"><circle cx="856" cy="275" r="10"/><circle cx="899" cy="253" r="8"/><circle cx="937" cy="292" r="12"/><circle cx="985" cy="258" r="9"/><circle cx="1037" cy="282" r="11"/></g>
    <g stroke="#80b6a1" stroke-width="3"><line x1="856" y1="242" x2="856" y2="218"/><line x1="899" y1="294" x2="899" y2="318"/><line x1="937" y1="247" x2="937" y2="220"/><line x1="985" y1="295" x2="985" y2="318"/><line x1="1037" y1="246" x2="1037" y2="222"/></g>
    <text x="822" y="362" fill="#172130" font-size="27" font-weight="700">Stochastic closure</text>
    <text x="822" y="401" fill="#4f5d70" font-size="21">• collision-localised kicks</text>
    <text x="822" y="434" fill="#4f5d70" font-size="19">• covariance related to local collision rate</text>
    <text x="822" y="467" fill="#4f5d70" font-size="21">• unresolved history only</text>

    <!-- stage 4 -->
    <g filter="url(#shadow)"><rect x="1167" y="150" width="391" height="350" rx="20" fill="#fff" stroke="#acd0c0" stroke-width="2"/></g>
    <rect x="1167" y="150" width="391" height="60" rx="20" fill="#14734f"/><rect x="1167" y="190" width="391" height="20" fill="#14734f"/>
    <text x="1362" y="190" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">4 · REDUCED DENSITY EQUATION</text>
    <rect x="1206" y="235" width="312" height="82" rx="12" fill="#eaf5f0"/>
    <path d="M1220 292C1275 236 1325 313 1377 261S1463 305 1504 256" fill="none" stroke="#16815b" stroke-width="6" stroke-linecap="round"/>
    <text x="1197" y="362" fill="#172130" font-size="27" font-weight="700">Particle-density evolution</text>
    <text x="1197" y="401" fill="#4f5d70" font-size="21">• closed velocity representation</text>
    <text x="1197" y="434" fill="#4f5d70" font-size="21">• reduced evolution equation</text>
    <text x="1197" y="467" fill="#4f5d70" font-size="21">• particle-density field</text>

    <!-- extension and validation band -->
    <rect x="42" y="544" width="1516" height="166" rx="20" fill="#f0f6f3" stroke="#afd0c0" stroke-width="2"/>
    <text x="76" y="584" fill="#14734f" font-size="21" font-weight="750" letter-spacing="1">WALL-BOUNDED EXTENSION TO TEST</text>
    <g font-size="18" font-weight="650" text-anchor="middle">
      <rect x="76" y="604" width="210" height="42" rx="21" fill="#fff" stroke="#c6ded3"/><text x="181" y="631" fill="#29425f">directional anisotropy</text>
      <rect x="302" y="604" width="230" height="42" rx="21" fill="#fff" stroke="#c6ded3"/><text x="417" y="631" fill="#29425f">non-uniform pair supply</text>
      <rect x="548" y="604" width="244" height="42" rx="21" fill="#fff" stroke="#c6ded3"/><text x="670" y="631" fill="#29425f">orientation-dependent motion</text>
      <rect x="808" y="604" width="216" height="42" rx="21" fill="#fff" stroke="#c6ded3"/><text x="916" y="631" fill="#29425f">collision selection</text>
      <rect x="1040" y="604" width="210" height="42" rx="21" fill="#fff" stroke="#c6ded3"/><text x="1145" y="631" fill="#29425f">same-pair recurrence</text>
      <rect x="1266" y="604" width="252" height="42" rx="21" fill="#fff" stroke="#c6ded3"/><text x="1392" y="631" fill="#29425f">pair-resolved information?</text>
    </g>
    <text x="834" y="676" text-anchor="middle" fill="#14734f" font-size="19" font-weight="700">incorporate collision statistics and anisotropic organisation identified in the near-wall setting</text>
    <path d="M1450 694H217" fill="none" stroke="#16815b" stroke-width="5" marker-end="url(#return)"/>
  </g>
</svg>
